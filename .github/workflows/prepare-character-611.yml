name: Apply inspected ankle fitting correction
on:
  push:
    branches: [fix/character-shoe-anchors-no-belt]
    paths: ['.github/workflows/prepare-character-611.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source correction and verify
        run: |
          set -euo pipefail
          python3 tools/apply-character-611.py
          node --check src/fps/character-footwear.mjs
          node --check src/fps/character-library.mjs
          node --check tools/character-footwear-browser.mjs
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test character-design/*.test.mjs src/fps/view-character-appearance.test.mjs
          node tools/verify-owner-runtime.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-character-611.yml tools/apply-character-611.py
          git add -u
          git diff --cached --check
          git commit -m 'Fit shoes to real ankles, remove human duty belts and refresh 6.1.1 cache'
          git push origin "HEAD:${GITHUB_REF_NAME}"
