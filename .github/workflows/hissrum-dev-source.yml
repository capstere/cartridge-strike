name: Hissrum12 reference extraction (editor development only)
on:
  push:
    branches: [work/design-studio-hissrum12-v4]
    paths: [.github/workflows/hissrum-dev-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: capstere/jedi
          ref: 0ed0c4defed19578c42e660f4c2fbae2dfc1e686
          path: reference-jedi
          persist-credentials: false
      - name: Bundle public original Hissrum12 geometry reference only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          base=Path("reference-jedi")
          names=["planner-core.js","object-library.js","studio-core.js","README_UTVECKLING.md","model_manifest.json","provenance.json"]
          with zipfile.ZipFile("hissrum12-public-reference.zip","w",zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  p=base/n;assert p.is_file(),p
                  z.write(p,n)
          print("PASS: six public geometry reference files from pinned commit")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hissrum12-public-reference-source
          path: hissrum12-public-reference.zip
          retention-days: 3
