name: Align authoring capacity messages
on:
  push:
    branches: [fix/studio-authoring-capacity]
    paths: ['.github/workflows/prepare-authoring-capacity.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct legacy messages without changing the limits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '01cc839c513d23efb0c2ebdb55e22ee7d44355b5'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('furniture-editor/build/build-mode.mjs')
          text=p.read_text()
          changes={
              "throw Error('Max 40 affischer per projekt.');":"throw Error(`Redigerarens resursgräns är ${POSTER_MAX} affischer. Spara en säkerhetskopia.`);",
              "notify?.('Max 120 gardiner/persienner.');":"notify?.(`Redigerarens resursgräns är ${TREATMENTS_MAX} gardiner/persienner. Spara en säkerhetskopia.`);",
              "notify?.('Max 40 affischer.');":"notify?.(`Redigerarens resursgräns är ${POSTER_MAX} affischer. Spara en säkerhetskopia.`);"
          }
          for before,after in changes.items():
              assert text.count(before)==1, before
              text=text.replace(before,after)
          p.write_text(text)
          PY
          node --check furniture-editor/build/build-mode.mjs
          node tools/verify-owner-runtime.mjs
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test furniture-editor/*.test.mjs furniture-editor/build/*.test.mjs furniture-editor/library/*.test.mjs src/fps/level-adapter.test.mjs src/fps/walk-start.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furniture-editor/build/build-mode.mjs
          git diff --cached --check
          git commit -m 'Keep capacity warnings truthful in the legacy editor'
          git push origin "HEAD:${GITHUB_REF_NAME}"
