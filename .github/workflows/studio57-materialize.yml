name: Materialize verified Studio 5.7 patch
on:
  push:
    branches: [fix/studio57-seams-curtains-materials]
    paths: ['tools/studio57-delta.*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and materialize exact locally tested files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          sha = lambda b: hashlib.sha256(b).hexdigest()
          encoded = ''.join(pathlib.Path(f'tools/studio57-delta.{i}').read_text().strip() for i in (1,2,3))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert sha(raw) == '3296194d4e1969847ab9edcaecfb1a44c1d058b17145f8ef3298b9422f5d7431', 'Payload checksum mismatch'
          payload = json.loads(raw)
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          assert parent == payload['baseCommit'], 'Unexpected branch ancestry'
          assert len(payload['files']) == 31
          prepared = []
          for row in payload['files']:
              path = pathlib.Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert row['path'].startswith(('furniture-editor/', 'src/fps/', 'fps/', 'docs/', 'tools/')) or row['path'] in ('build-info.json', '.github/workflows/design-studio-current.yml')
              if row['base'] is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
                  text = row['content']
              else:
                  original = path.read_bytes()
                  assert sha(original) == row['base'], f'Base checksum mismatch: {path}'
                  text = original.decode('utf-8')
                  for start, end, replacement in reversed(row['edits']):
                      assert 0 <= start <= end <= len(text)
                      text = text[:start] + replacement + text[end:]
              out = text.encode('utf-8')
              assert sha(out) == row['sha256'], f'Target checksum mismatch: {path}'
              prepared.append((path,out))
          for path,out in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(out)
          print('Verified and wrote',len(prepared),'exact source files; no private project assets.')
          PY
          rm tools/studio57-delta.{1,2,3} .github/workflows/studio57-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix window joints, sheer curtain presets and reopened floor materials'
          git push origin "HEAD:${GITHUB_REF_NAME}"
