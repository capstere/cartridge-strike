name: Finalize cache-safe waist follow-up
on:
  push:
    branches: [fix/character-shoe-anchors-no-belt]
    paths: ['.github/workflows/prepare-character-612-cache.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh the verified 6.1.2 cache chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          assert hashlib.sha256(Path('character-design/fashion-preview.mjs').read_bytes()).hexdigest()=='8b73e2dad90bfe3d94ea477dee5f8f2c40b0396afca31d45e50def91b76ef407'
          for f in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=Path(f)
              if p.is_file() and p.suffix in {'.mjs','.js','.html','.css'} and not f.startswith(('vendor/','frontline/')):
                  s=p.read_text();n=s.replace('v=6.1.1','v=6.1.2').replace("studioVersion:'6.1.1'","studioVersion:'6.1.2'").replace('<span class="edition">6.1.1</span>','<span class="edition">6.1.2</span>').replace('karaktärspaket 6.1.1\\n','karaktärspaket 6.1.2\\n')
                  if n!=s:p.write_text(n)
          p=Path('docs/character-design-6.1.1.md');s=p.read_text().replace('# Character Studio 6.1.1 —','# Character Studio 6.1.1 / 6.1.2 —').replace('edition label is **6.1.1**','edition label is **6.1.2**');p.write_text(s)
          p=Path('build-info.json');info=json.loads(p.read_text())
          for row in info['files']:
              b=Path(row['path']).read_bytes();row['bytes']=len(b);row['sha256']=hashlib.sha256(b).hexdigest()
          info['bytes']=sum(r['bytes'] for r in info['files']);p.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test character-design/*.test.mjs src/fps/view-character-appearance.test.mjs
          node tools/verify-owner-runtime.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-character-612-cache.yml
          git add -u
          git diff --cached --check
          git commit -m 'Publish waist-seam follow-up as cache-safe Character Studio 6.1.2'
          git push origin "HEAD:${GITHUB_REF_NAME}"
