# Temporary, single-use repair for GLB blobs clipped during the original connector upload.
# Triggered only when this workflow file is introduced/changed on its exact PR branch.
name: Restore complete onboard GLBs (one-shot)
on:
  push:
    branches:
      - work/onboard-studio-20261030
    paths:
      - .github/workflows/repair-onboard-assets-20261030.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/onboard-studio-20261030
          persist-credentials: true
      - name: Download and verify original GitHub model bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          catalog_path = Path('furniture-editor/library/onboard-catalog.mjs')
          content = catalog_path.read_text(encoding='utf-8')
          entries = json.loads(content[content.index('['):content.rindex(']')+1])
          assert len(entries) == 28, 'Unexpected model count'
          restored = 0
          for entry in entries:
              assert entry['source'] == 'capstere/onboard'
              assert entry['url'].startswith('./library/models/onboard/')
              dest = Path('furniture-editor') / entry['url'][2:]
              expected_sha = entry['sha256']
              expected_size = entry['bytes']
              assert len(expected_sha) == 64 and 28 <= expected_size <= 8 * 1024 * 1024
              if dest.is_file():
                  existing = dest.read_bytes()
                  if len(existing) == expected_size and hashlib.sha256(existing).hexdigest() == expected_sha:
                      continue
              commit = entry['sourceCommit']
              assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
              source_path = entry['sourcePath']
              assert source_path.startswith('asset-portfolio/') and '..' not in source_path.split('/')
              url = 'https://raw.githubusercontent.com/capstere/onboard/' + commit + '/' + quote(source_path, safe='/')
              req = Request(url, headers={'User-Agent': 'CartridgeStrike-Verified-Asset-Restore'})
              with urlopen(req, timeout=90) as response:
                  data = response.read(8 * 1024 * 1024 + 1)
              assert len(data) == expected_size, f'{dest} file size mismatch: {len(data)} vs {expected_size}'
              assert hashlib.sha256(data).hexdigest() == expected_sha, f'{dest} SHA-256 mismatch'
              assert data[:4] == b'glTF', f'{dest} bad GLB magic'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              restored += 1
              print('RESTORED', dest, len(data), flush=True)
          for entry in entries:
              dest = Path('furniture-editor') / entry['url'][2:]
              data = dest.read_bytes()
              assert len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256'], dest
          print('PASS: all 28 onboard GLBs match pinned source checksums; restored', restored)
          PY
          git add -- furniture-editor/library/models/onboard
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: restore complete onboard GLB binaries from pinned sources'
            git push origin HEAD:refs/heads/work/onboard-studio-20261030
          fi
