name: Prepare verified GeneXpert asset integration
on:
  push:
    branches: [feat/genexpert-models]
    paths: ['.github/workflows/genexpert-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Receive and verify the exact authorized source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,zipfile,io,hashlib,json,pathlib
          url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-4760-81f4-988b-c1d1fe325ff3/raw?se=2026-11-03T15%3A58%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=ea16cfb6-7492-5093-b2d4-462e385ab30c&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T04%3A36%3A11Z&ske=2026-11-04T04%3A36%3A11Z&sks=b&skv=2026-02-06&sig=/c/7TJoiMiFGabTLzPYEgmZO86ETSQPpegxMjQaWC0E%3D'
          raw=urllib.request.urlopen(url,timeout=60).read(4*1024*1024)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(raw)=='68da572d176d25bee899e6ba4fd96d6ed2c1dda947da5f408cbfff6633274859','Transfer checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              manifest=json.loads(z.read('transfer.json'))
              assert manifest['baseCommit']=='67a4c56b588a61263ee72d990d5b710f0fa70b23'
              assert len(manifest['files'])==38
              assert set(z.namelist())=={'transfer.json',*(r['path'] for r in manifest['files'])}
              prepared=[]
              for row in manifest['files']:
                  p=pathlib.Path(row['path']);assert not p.is_absolute() and '..' not in p.parts
                  assert row['path'].startswith(('furniture-editor/','src/fps/','fps/','docs/','tools/','licenses/')) or row['path']=='credits.html'
                  assert not row['path'].startswith('.github/')
                  assert (sha(p.read_bytes()) if p.exists() else None)==row['base'],f'Changed source: {p}'
                  data=z.read(row['path']);assert len(data)==row['bytes'] and sha(data)==row['sha256']
                  prepared.append((p,data))
              for p,data in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          pathlib.Path('/tmp/genexpert-manifest.json').write_text(json.dumps(manifest))
          print('Received 38 hash-verified files, including both byte-identical user uploads.')
          PY
      - name: Install existing pinned Chromium
        run: |
          npm ci --prefix frontline/source/tools/dev --ignore-scripts --no-audit --no-fund
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
      - name: Generate thumbnails from original GLBs using actual WebGL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gx-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/furniture-editor/new.html >/dev/null && break; sleep 1; done
          GENERATE_THUMBS=1 THUMBS_ONLY=1 timeout 150s node tools/genexpert-browser.mjs
      - name: Update public asset manifest and commit exact source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('build-info.json');info=json.loads(p.read_text());rows={r['path']:r for r in info['files']}
          manifest=json.loads(pathlib.Path('/tmp/genexpert-manifest.json').read_text())
          for row in manifest['files']:
              name=row['path']
              if name.startswith(('docs/','tools/')) or '.test.' in name:continue
              rows[name]={'path':name}
          for thumb in pathlib.Path('furniture-editor/library/thumbs/genexpert').glob('*.png'):rows[str(thumb)]={'path':str(thumb)}
          for name,row in rows.items():
              b=pathlib.Path(name).read_bytes();row.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
          info['files']=[rows[k] for k in sorted(rows)];info['bytes']=sum(r['bytes'] for r in info['files'])
          p.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
          node tools/verify-owner-runtime.mjs
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test furniture-editor/library/genexpert.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add credits.html docs/genexpert-models.md licenses/genexpert-user-supplied.txt fps furniture-editor src/fps tools/genexpert-browser.mjs build-info.json
          git diff --cached --check
          git commit -m 'Add original GeneXpert GX16 and Infinity-80 models to Studio and FPS'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Real UI, native ZIP and FPS rendering verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gx-browser-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/furniture-editor/new.html >/dev/null && break; sleep 1; done
          timeout 240s node tools/genexpert-browser.mjs
      - name: Small synthetic preview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genexpert-preview-proof
          path: |
            test-results/genexpert/
            furniture-editor/library/thumbs/genexpert/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 9
