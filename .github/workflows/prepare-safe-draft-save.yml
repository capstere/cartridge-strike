name: Prepare reviewed safe draft saving
on:
  push:
    branches: [fix/floor5-safe-drafts-20261104]
    paths: ['tools/apply-safe-draft-save.py']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply readable, locally replay-tested source changes
        run: |
          set -euo pipefail
          python3 tools/apply-safe-draft-save.py
          node --check furniture-editor/new.mjs
          node tools/verify-owner-runtime.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furniture-editor src/fps fps build-info.json
          git commit -m 'Separate lossless draft saving from level playability and protect autosaves'
          git push origin "HEAD:${GITHUB_REF_NAME}"
