name: Prepare verified character role sources
on:
  push:
    branches: [feat/character-roles-and-clean-footwear]
    paths: ['tools/c61-transfer-*.json', '.github/workflows/prepare-character-roles.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every old and new source hash before writing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, json, subprocess
          sha=lambda b: hashlib.sha256(b).hexdigest()
          meta=json.loads(pathlib.Path('tools/c61-transfer-meta.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',meta['base'],'HEAD'],check=True)
          rows=[]
          for i in range(1,8): rows.extend(json.loads(pathlib.Path(f'tools/c61-transfer-{i}.json').read_text()))
          assert len(rows)==62 and len({x['path'] for x in rows})==62
          prepared=[]
          for row in rows:
              path=pathlib.Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert row['path'].startswith(('character-design/','src/fps/','fps/','tools/','docs/')) or row['path']=='assets/fps/character-overrides.json'
              if row['base'] is None:
                  assert not path.exists(), f'Unexpected file: {path}'
                  text=row['content']
              else:
                  original=path.read_bytes()
                  assert sha(original)==row['base'], f'Base mismatch: {path}'
                  text=original.decode('utf-8')
                  for start,end,replacement in reversed(row['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              data=text.encode('utf-8')
              assert sha(data)==row['sha256'], f'Target mismatch: {path}'
              prepared.append((path,data))
          for path,data in prepared:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          info=pathlib.Path('build-info.json');manifest=json.loads(info.read_text())
          for path in meta['manifestPaths']:
              if not any(x['path']==path for x in manifest['files']): manifest['files'].append({'path':path,'bytes':0,'sha256':''})
          for row in manifest['files']:
              data=pathlib.Path(row['path']).read_bytes();row['bytes']=len(data);row['sha256']=sha(data)
          manifest['bytes']=sum(x['bytes'] for x in manifest['files'])
          data=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          assert sha(data)==meta['manifestSHA256'], 'Runtime manifest differs from locally tested source'
          info.write_bytes(data)
          print('All 62 source files and runtime manifest verified.')
          PY
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test character-design/*.test.mjs src/fps/view-character-appearance.test.mjs
          node tools/verify-owner-runtime.mjs
          rm tools/c61-transfer-*.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add editable actor roles, checked game packages and continuous low shoes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
