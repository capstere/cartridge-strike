name: Character Design Studio - no-code editor smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'character-design/**'
      - '.github/workflows/character-design-studio.yml'
      - 'vendor/three/addons/exporters/GLTFExporter.js'
  push:
    branches: [main]
    paths:
      - 'character-design/**'
      - '.github/workflows/character-design-studio.yml'
      - 'vendor/three/addons/exporters/GLTFExporter.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and exact asset/export contracts
        run: |
          set -euo pipefail
          for f in character-design/*.mjs; do node --check "$f"; done
          node --test character-design/*.test.mjs
          node tools/verify-owner-runtime.mjs
      - name: Install existing pinned Chromium and WebGL runtime
        run: |
          npm ci --prefix frontline/source/tools/dev --ignore-scripts --no-audit --no-fund
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
          sudo timeout 80s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb
      - name: Character creation, animation, object and AI-export browser smoke
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/character-studio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/character-design/ >/dev/null; then break; fi
            sleep 1
          done
          timeout 220s xvfb-run -a node character-design/browser-smoke.mjs
          timeout 300s xvfb-run -a node character-design/studio4-browser.mjs
          timeout 180s xvfb-run -a node character-design/accessory-quality-browser.mjs
          timeout 360s xvfb-run -a node character-design/sculpt-browser.mjs
          timeout 360s xvfb-run -a node character-design/realism-browser.mjs
      - name: Verify published Pages with real desktop and touch WebGL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHARACTER_TEST_ORIGIN: https://capstere.github.io/cartridge-strike
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsS "${CHARACTER_TEST_ORIGIN}/character-design/?verify=${GITHUB_SHA}" | grep -q 'class="edition">5.2'; then break; fi
            sleep 5
          done
          timeout 220s xvfb-run -a node character-design/browser-smoke.mjs
          timeout 300s xvfb-run -a node character-design/studio4-browser.mjs
          timeout 180s xvfb-run -a node character-design/accessory-quality-browser.mjs
          timeout 360s xvfb-run -a node character-design/sculpt-browser.mjs
          timeout 360s xvfb-run -a node character-design/realism-browser.mjs
      # Intentionally no upload-artifact action: preserve the repo's tiny Actions storage quota.
