name: Prepare character rig reuse regression correction
on:
  push:
    branches: [feat/character-roles-and-clean-footwear]
    paths: ['.github/workflows/prepare-character-menu-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize optional dwarf flag before comparing actor types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          def change(path,old,new,expected):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old)
              out=s.replace(old,new);assert hashlib.sha256(out.encode()).hexdigest()==expected,path;p.write_text(out)
          change('character-design/workbench.mjs',"this.avatar.isDwarf!==(roleOf(project)==='dwarf')","!!this.avatar.isDwarf!==(roleOf(project)==='dwarf')",'c59633ed2a31e31bdca574277cc26907ee19e3f7d397ff6c33df93167978e65b')
          change('tools/character-roles-browser.mjs',"await page.locator('[data-tab=\"look\"]').click();await page.locator('[data-color=\"jacket\"]:visible').first().fill(v.color);","await page.locator('[data-tab=\"look\"]').click();const beforeColour=await page.evaluate(()=>__characterStudio.workbench.avatar.root.uuid);await page.locator('[data-color=\"jacket\"]:visible').first().fill(v.color);assert.equal(await page.evaluate(()=>__characterStudio.workbench.avatar.root.uuid),beforeColour);",'e73d5dbd29cf961c6de126a2637e18de07970e60b7b07d070489e740f9080cc7')
          p=Path('build-info.json');j=json.loads(p.read_text())
          for row in j['files']:
              data=Path(row['path']).read_bytes();row['bytes']=len(data);row['sha256']=hashlib.sha256(data).hexdigest()
          j['bytes']=sum(x['bytes'] for x in j['files']);p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test character-design/*.test.mjs src/fps/view-character-appearance.test.mjs
          node tools/verify-owner-runtime.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character-design/workbench.mjs tools/character-roles-browser.mjs build-info.json
          git diff --cached --check
          git commit -m 'Preserve the edited human rig during colour-only appearance changes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
