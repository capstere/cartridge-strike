name: Level project and WebGL journey
on:
  pull_request:
    paths:
      - 'furniture-editor/**'
      - 'studio/**'
      - 'tools/studio-ux-browser.mjs'
      - 'fps/index.html'
      - 'src/**'
      - 'levels/**'
      - 'tools/level-*'
      - 'tools/direct-*'
      - 'tools/restore-onboard-large.mjs'
      - 'tools/onboard-large-source-catalog.json'
      - '.github/workflows/level-project.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure tests, Floor 5 doors and SHA manifest
        run: |
          node --check tools/restore-onboard-large.mjs
          for file in tools/studio-ux-browser.mjs furniture-editor/studio-ui.mjs character-design/app.mjs; do node --check "$file"; done
          node --test studio/studio.test.mjs
          node tools/restore-onboard-large.mjs --plan
          node --experimental-loader ./tools/vendor-three-test-loader.mjs --test furniture-editor/*.test.mjs furniture-editor/build/*.test.mjs furniture-editor/library/*.test.mjs src/fps/level-adapter.test.mjs src/fps/walk-start.test.mjs
          node --experimental-loader ./tools/vendor-three-test-loader.mjs tools/owner-door-traversal.mjs
          node tools/verify-owner-runtime.mjs
          node --experimental-loader ./tools/vendor-three-test-loader.mjs tools/level-door-traversal.mjs
      - name: Install pinned browser and software WebGL
        run: |
          npm ci --prefix frontline/source/tools/dev --ignore-scripts --no-audit --no-fund
          node frontline/source/tools/dev/node_modules/playwright-core/cli.js install chromium
          sudo timeout 80s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y libgl1-mesa-dri libglx-mesa0 xvfb
      - name: Test original editor, new studio and both FPS levels in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/level-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          timeout 220s xvfb-run -a node furniture-editor/editor-browser.mjs
          timeout 220s xvfb-run -a node furniture-editor/build/build-browser.mjs
          timeout 360s xvfb-run -a node tools/level-browser-smoke.mjs
          timeout 420s xvfb-run -a node tools/direct-browser-smoke.mjs
          timeout 420s xvfb-run -a node tools/onboard-library-smoke.mjs
          timeout 300s xvfb-run -a node tools/studio-ux-browser.mjs
